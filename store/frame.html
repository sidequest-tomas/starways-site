<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<style>
html,body{margin:0;overflow:hidden;background:#070b18}
body{position:relative}
#sky{position:absolute;inset:0}
.cap{position:absolute;left:0;right:0;text-align:center;padding:0 70px}
h2{font:400 var(--h,76px)/1.08 "Marcellus",Georgia,serif;color:#e6eaf5;margin:0;text-wrap:balance}
p{font:400 var(--p,36px)/1.35 "IBM Plex Sans",sans-serif;color:#f2cf63;margin:22px 0 0;text-wrap:balance}
.shot{position:absolute;left:50%;transform:translateX(-50%);border-radius:40px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 10px #0d1428,0 0 0 11px #22305a}
.shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
</style></head><body>
<svg id="sky"></svg>
<div class="cap"><h2 id="h"></h2><p id="p"></p></div>
<div class="shot"><img id="img"></div>
<script>
const q=new URLSearchParams(location.search), W=+q.get('w'), H=+q.get('h');
document.body.style.width=W+'px';document.body.style.height=H+'px';
h.textContent=q.get('t');p.textContent=q.get('s')||'';
const k=W/1080; document.documentElement.style.setProperty('--h',Math.round(76*k)+'px');document.documentElement.style.setProperty('--p',Math.round(36*k)+'px');
const cap=document.querySelector('.cap');cap.style.top=Math.round(110*k)+'px';
const im=document.getElementById('img'), box=document.querySelector('.shot');
im.onload=()=>{const top=Math.round(H*0.205), avail=H-top-Math.round(70*k), ar=im.naturalWidth/im.naturalHeight;
 let bh=avail, bw=bh*ar; if(bw>W*0.82){bw=W*0.82;bh=bw/ar}
 box.style.width=bw+'px';box.style.height=bh+'px';box.style.top=top+'px';box.style.borderRadius=Math.round(40*k)+'px';document.title='ready'};
im.src=q.get('img');
const sv=document.getElementById('sky');sv.setAttribute('width',W);sv.setAttribute('height',H);
let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;let html=`<defs><radialGradient id="g" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#16224a"/><stop offset="1" stop-color="#070b18"/></radialGradient></defs><rect width="${W}" height="${H}" fill="url(#g)"/>`;
for(let i=0;i<W*H/9000;i++){const m=r();html+=`<circle cx="${(r()*W).toFixed(1)}" cy="${(r()*H).toFixed(1)}" r="${((m<.9?.6+m*.8:1.6+m*.8)*k).toFixed(2)}" fill="#e6eaf5" opacity="${(.2+r()*.5).toFixed(2)}"/>`}
sv.innerHTML=html;
</script></body></html>
